name: bundle size

on:
  push:
    branches: [main]
    paths-ignore:
      - 'projects/libraries/streamix/bundle-size.svg'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  badge:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Use npm 12 (the lockfile is generated by local npm 12)
        run: npm install -g npm@12

      - name: Install dependencies
        run: npm ci

      - name: Build library
        run: npm run build

      - name: Calculate gzipped bundle size
        id: gzip
        run: |
          if [ ! -f "dist/streamix/fesm2022/epikodelabs-streamix.mjs" ]; then
            echo "Bundle file not found"
            ls -la dist/streamix/fesm2022/ || echo "Directory doesn't exist"
            exit 1
          fi

          gzip -c dist/streamix/fesm2022/epikodelabs-streamix.mjs > dist/streamix/fesm2022/epikodelabs-streamix.mjs.gz
          SIZE=$(stat -c%s dist/streamix/fesm2022/epikodelabs-streamix.mjs.gz)
          SIZE_KB=$((SIZE / 1024))
          echo "BUNDLE_SIZE=${SIZE_KB}" >> $GITHUB_ENV
          echo "Gzipped bundle size: ${SIZE_KB} KB"

      - name: Generate badge
        run: |
          mkdir -p projects/libraries/streamix
          COLOR="brightgreen"
          if [ $BUNDLE_SIZE -gt 200 ]; then COLOR="red"; fi
          if [ $BUNDLE_SIZE -gt 100 ] && [ $BUNDLE_SIZE -le 200 ]; then COLOR="yellow"; fi

          echo "Creating badge with ${BUNDLE_SIZE}KB and color ${COLOR}"
          curl -s -o projects/libraries/streamix/bundle-size.svg \
            "https://img.shields.io/badge/bundle-${BUNDLE_SIZE}KB-${COLOR}.svg"

          if [ -f "projects/libraries/streamix/bundle-size.svg" ]; then
            echo "Badge created successfully"
          else
            echo "Badge creation failed"
            exit 1
          fi

      - name: Configure git
        run: |
          git config user.name "oleksii-shepel"
          git config user.email "113843497+oleksii-shepel@users.noreply.github.com"

      - name: Commit and push badge
        env:
          GH_TOKEN: ${{ secrets.STREAMIX_BADGE_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::error::Set the STREAMIX_BADGE_TOKEN repository secret to an oleksii-shepel token with Contents: write access to this repository."
            exit 1
          fi

          TOKEN_OWNER=$(gh api user --jq .login)
          if [ "$TOKEN_OWNER" != "oleksii-shepel" ]; then
            echo "::error::STREAMIX_BADGE_TOKEN must belong to oleksii-shepel, the account allowed to update main."
            exit 1
          fi

          # Use the owner credential only in this publishing step.
          git config --local credential.helper ''
          git config --local --add credential.helper '!gh auth git-credential'
          git checkout main
          git pull origin main
          git add projects/libraries/streamix/bundle-size.svg

          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            echo "Committing badge update..."
            git commit -m "Update bundle size badge [skip ci]"
            echo "Pushing to repository..."
            git push origin HEAD:main
            echo "Badge updated successfully"
          fi
