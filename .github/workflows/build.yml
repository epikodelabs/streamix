name: build

on:
  push:
    branches: ["main", "experimental"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [22.x]

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Use npm 12 (the lockfile is generated by local npm 12)
        run: npm install -g npm@12

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Build streamix
        run: npm run build:packages

      - name: Install browser binaries for testify
        run: npm run test:install-browser

      - name: Test
        run: npm test

      - name: Check package contents
        run: npm run pack:check