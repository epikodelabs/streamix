<div class="shell">
  <header class="hero">
    <div>
      <p class="eyebrow">Angular 21.1.3 · July 16, 2026 workspace</p>
      <h1>Comprehensive forms in two modes.</h1>
      <p class="lede">
        `app11` contrasts a pure Angular reactive-form implementation with a
        second page that keeps Angular forms for rendering while handing derived
        state and autosave orchestration to `streamix`.
      </p>
    </div>

    <nav class="nav">
      <a
        routerLink="/angular"
        routerLinkActive="active"
        [routerLinkActiveOptions]="{ exact: true }"
      >
        Angular Only
      </a>
      <a routerLink="/streamix" routerLinkActive="active">
        Angular + Streamix
      </a>
    </nav>
  </header>

  <router-outlet />
</div>
